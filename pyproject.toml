[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiorexense"
dynamic = ["version"]
description = "Asynchronous Rexense gateway and device clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RexenseIoT", email = "yuxiaoqiang@rexense.com" }]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12.0,<4", "yarl>=1.17.0,<2"]
classifiers = [
  "Framework :: AsyncIO",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/RexenseIoT/aiorexense"
Repository = "https://github.com/RexenseIoT/aiorexense"
Issues = "https://github.com/RexenseIoT/aiorexense/issues"
Changelog = "https://github.com/RexenseIoT/aiorexense/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["aiorexense"]
package-dir = { aiorexense = "src" }

[tool.setuptools.package-data]
aiorexense = ["py.typed", "thing_model_v3.json"]

[tool.setuptools.dynamic]
version = { attr = "aiorexense.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = ["src/gateway.py", "src/models.py", "src/client.py"]
