name: Test, build and publish

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: pytest --cov=aiorexense --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]' build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the installed wheel includes its runtime resources
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c 'from aiorexense import RexenseGateway, RexenseWebsocketClient, load_baseline; assert "domains" in load_baseline()'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [test, build]
    if: >-
      github.repository == 'RexenseIoT/aiorexense' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiorexense/
    permissions:
      contents: read
      id-token: write # Authenticate to PyPI and sign publish attestations.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distributions
          path: dist/
      - name: Validate the release tag against the tested wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import email.parser
          import os
          from pathlib import Path
          import re
          import zipfile

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Only a stable vX.Y.Z release tag is accepted')
          requested = tag[1:]
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected exactly one built wheel')
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_name, = [name for name in wheel.namelist() if name.endswith('.dist-info/METADATA')]
              metadata = email.parser.Parser().parsestr(wheel.read(metadata_name).decode())
          if metadata['Name'] != 'aiorexense' or metadata['Version'] != requested:
              raise SystemExit('Built distribution does not match the requested release')
          PY
      - name: Publish the tested CI artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
